name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ps2exe
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue
          $installed = $false
          for ($i = 1; $i -le 3; $i++) {
            try {
              Install-Module ps2exe -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
              $installed = $true
              break
            } catch {
              Write-Warning "ps2exe install attempt $i failed: $($_.Exception.Message)"
              Start-Sleep -Seconds 10
            }
          }
          if (-not $installed) { throw 'Could not install ps2exe after 3 attempts' }
          Get-Module -ListAvailable ps2exe | Select-Object Name, Version

      - name: Build x64 + x86 executables
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          $version = '1.0.2.0'
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)') {
            $version = "$($matches[1]).0"
          }
          Write-Host "Building version $version"

          .\src\Build-Exe.ps1 -Version $version -Architecture Both

      - name: Write checksums
        shell: powershell
        run: |
          $files = @(
            'dist\Windows-Update-Manager-x64.exe',
            'dist\Windows-Update-Manager-x86.exe'
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { throw "Missing build output: $f" }
          }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path -Leaf $f)"
          }
          $lines | Out-File -FilePath 'dist\SHA256SUMS.txt' -Encoding ascii
          Get-Content 'dist\SHA256SUMS.txt'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Update-Manager
          path: |
            dist/Windows-Update-Manager-x64.exe
            dist/Windows-Update-Manager-x86.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Windows-Update-Manager-x64.exe
            dist/Windows-Update-Manager-x86.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          body: |
            ## Download

            | Your Windows | File |
            | --- | --- |
            | **64-bit** (Windows 8/8.1/10/11 x64 — almost everyone) | `Windows-Update-Manager-x64.exe` |
            | **32-bit** (Windows 8/8.1/10 x86) | `Windows-Update-Manager-x86.exe` |

            Verify your download against `SHA256SUMS.txt`.

            ## Notes

            - Services are never stopped or disabled, so the Microsoft Store keeps working.
            - The 32-bit build refuses to run on 64-bit Windows. A 32-bit process is redirected to
              `WOW6432Node` and `SysWOW64`, where Windows does not read these policies.
            - The binaries are unsigned, so SmartScreen may warn on first run. Build from source if
              that matters to you.

            Full details: [CHANGELOG.md](https://github.com/Dragonbot-12012/windows-update-manager/blob/main/CHANGELOG.md)
