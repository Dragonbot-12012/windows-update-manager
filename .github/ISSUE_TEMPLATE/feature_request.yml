name: Feature request
description: Suggest an improvement
title: "[Feature] "
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        Please keep the project's core constraints in mind:

        - Services must never be disabled or stopped (Microsoft Store compatibility).
        - Every change must be reversible by **Enable**.
        - The shipped app stays a single self-contained `.exe`.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Including built-in Windows settings or other tools.

  - type: dropdown
    id: windows
    attributes:
      label: Windows versions affected
      multiple: true
      options:
        - Windows 8
        - Windows 8.1
        - Windows 10
        - Windows 11
        - All
